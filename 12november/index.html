<script>
const LIVRO = {
  de: 'David',
  para: 'Lohanny',
  data: '2025-04-12',          // ano-mês-dia em que tudo começou
  hora: '21:00',
  cidade: 'Brusque, Santa Catarina',
  hemisferio: 'sul',           // 'sul' ou 'norte' (muda o lado iluminado da lua)
  musica: 'musica.mp3',                  // ex.: 'musica.mp3'
  fotoCapa: 'fotos/capa.jpg',

  titulos: {
    capa: 'O livro de nós dois',
    tempo: 'Juntos há',
    carta: 'Uma carta sua',
    baralho: 'A sorte foi minha',
    cabine: 'Cabine de fotos',
    ceu: 'O céu que nos viu',
    lua: 'A lua de plantão',
    jardim: 'Flores do caminho',
    buque: 'Buquê de motivos',
    lanternas: 'Luzes no lago',
    desejo: 'Um pedido'
  },

  fraseTempo: '“O amor nunca falha.” — 1 Coríntios 13:8',

  carta: 'Lohanny,\n\nVocê é a melhor coisa que já me aconteceu, nada nesse mundo se compara a um sorriso seu!\n\nCom todo o meu amor,\nDavid',

  // Baralho: 6 cartas, cada uma com foto e uma frase
  cartas: [
    { foto: 'fotos/03.jpg', texto: '“Eu sou do meu amado, e o meu amado é meu.” — Cantares 6:3' },
    { foto: 'fotos/05.jpg', texto: '“Achei aquele a quem ama a minha alma.” — Cantares 3:4' },
    { foto: 'fotos/08.jpg', texto: '“Melhor é serem dois do que um.” — Eclesiastes 4:9' },
    { foto: 'fotos/10.jpg', texto: '“Aonde quer que tu fores, irei eu.” — Rute 1:16' },
    { foto: 'fotos/12.jpg', texto: '“Nós amamos porque ele nos amou primeiro.” — 1 João 4:19' },
    { foto: 'fotos/15.jpg', texto: '“O que Deus ajuntou não o separe o homem.” — Marcos 10:9' }
  ],

  // Cabine: 8 fotos, 4 em cada tira
  cabine: ['fotos/01.jpg', 'fotos/04.jpg', 'fotos/07.jpg', 'fotos/13.jpg', 'fotos/02.jpg', 'fotos/09.jpg', 'fotos/14.jpg', 'fotos/11.jpg'],

  fraseJardim: '“Aparecem as flores na terra, o tempo de cantar chega.” — Cantares 2:12',

  // Buquê: 7 motivos, um por flor
  motivos: [
    '“O amor é paciente, o amor é bondoso.” — 1 Coríntios 13:4',
    '“Tudo sofre, tudo crê, tudo espera, tudo suporta.” — 1 Coríntios 13:7',
    '“Permanecem a fé, a esperança e o amor; mas o maior destes é o amor.” — 1 Coríntios 13:13',
    '“As muitas águas não poderiam apagar o amor, nem os rios afogá-lo.” — Cantares 8:7',
    '“No amor não há medo; o perfeito amor lança fora o medo.” — 1 João 4:18',
    '“Sobre tudo isto, revesti-vos de amor, que é o vínculo da perfeição.” — Colossenses 3:14',
    '“Todas as vossas coisas sejam feitas com amor.” — 1 Coríntios 16:14'
  ],
  fraseBuque: 'Pronto. É todo seu.',

  fotoDesejo: 'fotos/18.jpg',
  vocativoBilhete: 'Meu amoreco',
  desejo: 'estarei do seu lado sempre que precisar, não há nada mais importante pra mim do que a sua felicidade!',

  fraseFinal: 'As próximas páginas a gente escreve junto.'
};
</script>

<style>
:root{
  --gold:#d8b46a; --cream:#f4ecd8; --ink:#2a2420;
  --serif:"Playfair Display","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --script:"Pinyon Script","Segoe Script",cursive;
  --hand:"Caveat","Segoe Script","Bradley Hand",cursive;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(90% 70% at 50% 35%,#3b4150 0%,#1b1d25 65%,#101117 100%);color:#e9e4da;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;display:flex;flex-direction:column;height:100dvh}
button{font:inherit;cursor:pointer;color:inherit}
#wrap{flex:1;min-height:0;container-type:size;display:grid;place-items:center;overflow:hidden}
#wrap{position:relative}
.book{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(94cqw,135cqh,1150px);aspect-ratio:3/2;perspective:2600px;transition:transform .9s cubic-bezier(.4,.1,.2,1);
  filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
@media (max-aspect-ratio:1/1){.book{width:min(180cqw,132cqh)}}
.leaf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.4,.1,.2,1)}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;container-type:size;background:#111}
.face.front{border-radius:0 1.2% 1.2% 0}
.face.back{transform:rotateY(180deg);border-radius:1.2% 0 0 1.2%}
.pg{position:absolute;inset:0;font-family:var(--serif);font-size:4cqw;color:#f1ead9;overflow:hidden}
.face.front .pg::after,.face.back .pg::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:40}
.face.front .pg::after{background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,0) 9%)}
.face.back .pg::after{background:linear-gradient(270deg,rgba(0,0,0,.45),rgba(0,0,0,0) 9%)}
.turn{position:absolute;bottom:0;width:13cqw;height:13cqw;border:0;background:none;z-index:50;padding:0}
.face.front .turn{right:0;background:linear-gradient(315deg,rgba(255,255,255,.28) 0 30%,transparent 31%)}
.face.back .turn{left:0;background:linear-gradient(45deg,rgba(255,255,255,.28) 0 30%,transparent 31%)}
.turn:hover{filter:brightness(1.6)}
.head{position:absolute;left:0;right:0;top:7cqw;text-align:center;z-index:5;pointer-events:none;padding:0 8cqw}
.kick{font-size:2.3cqw;letter-spacing:.38em;text-transform:uppercase;opacity:.75;margin:0 0 1.2cqw;font-style:normal}
.ttl{font-size:6.6cqw;font-style:italic;font-weight:400;margin:0;line-height:1.1}
.hint{font-size:2.9cqw;font-style:italic;opacity:.75;margin:1.6cqw 0 0;transition:opacity .5s}
.orn{width:22cqw;height:1px;background:currentColor;opacity:.5;margin:2.2cqw auto 0;position:relative}
.orn::after{content:"";position:absolute;left:50%;top:-.9cqw;width:1.8cqw;height:1.8cqw;margin-left:-.9cqw;background:currentColor;transform:rotate(45deg)}
.ft{width:100%;height:100%;overflow:hidden;position:relative;background:#333}
.ft img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block}
.ft.vazia{background:linear-gradient(135deg,#c9a09c,#74648c)}
.ft.vazia:nth-child(even){background:linear-gradient(135deg,#9fb7a8,#4a6377)}
.ft.vazia::after{content:attr(data-n);position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.7);font:italic 3.4cqw var(--serif)}

.cena{position:absolute;inset:0;background-size:auto 100%;background-repeat:no-repeat}
.cena.sombra::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(10,8,25,.62),rgba(10,8,25,0) 36%,rgba(10,8,25,0) 68%,rgba(10,8,25,.55))}
.pg .head,.pg .info,.pg .rodape,.pg .conta{text-shadow:0 .3cqw 1.6cqw rgba(0,0,0,.9)}

/* tempo e carta */
.tmp .tiles{position:absolute;left:0;right:0;top:66cqw;display:flex;justify-content:center;gap:3cqw}
.tile{background:linear-gradient(#1c2350,#0f1433);border:.5cqw solid var(--gold);border-radius:1.5cqw;width:20cqw;padding:2.5cqw 0 1.8cqw;text-align:center;box-shadow:0 1cqw 3cqw rgba(0,0,0,.5)}
.tile b{display:block;font-size:10cqw;font-weight:400;line-height:1.05;font-variant-numeric:tabular-nums}
.tile small{font-size:2.1cqw;letter-spacing:.3em;text-transform:uppercase;opacity:.8}
.tmp .tiles.p{top:89cqw}.tiles.p .tile{width:13cqw;padding:1.6cqw 0 1.2cqw}.tiles.p b{font-size:5.6cqw}
.tmp .frase{position:absolute;left:9cqw;right:9cqw;top:107cqw;text-align:center;font-style:italic;font-size:4.2cqw;line-height:1.45;text-shadow:0 .3cqw 1.6cqw #000}
.crt .env{position:absolute;left:50%;top:60cqw;width:60cqw;height:40cqw;margin-left:-30cqw;background:#efe0c0;border-radius:1cqw;border:0;padding:0;box-shadow:0 2.5cqw 6cqw rgba(40,20,10,.5);transform:rotate(-4deg)}
.crt .env::before{content:"";position:absolute;inset:0;border-radius:1cqw;background:linear-gradient(135deg,transparent 49.6%,rgba(0,0,0,.14) 50%,transparent 50.6%),linear-gradient(225deg,transparent 49.6%,rgba(0,0,0,.14) 50%,transparent 50.6%)}
.crt .aba{position:absolute;left:0;right:0;top:0;height:58%;background:#e2cfa8;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .5s;z-index:2}
.crt .selo{position:absolute;left:50%;top:52%;width:11cqw;height:11cqw;margin:-5.5cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4495f,#7d2236);color:#f3dfc0;display:grid;place-items:center;font-size:5cqw;z-index:3;box-shadow:0 .5cqw 1.5cqw rgba(0,0,0,.4);transition:opacity .3s}
.crt .env.abre .aba{transform:rotateX(180deg)}.crt .env.abre .selo{opacity:0}
.crt .folha{position:absolute;inset:7cqw;background:#fffaf0;color:var(--ink);border-radius:1cqw;box-shadow:0 2cqw 8cqw rgba(0,0,0,.5);padding:9cqw 8cqw;overflow-y:auto;font-family:var(--hand);font-size:5cqw;line-height:1.5;white-space:pre-wrap;z-index:30;transform:translateY(118%);transition:transform .7s cubic-bezier(.2,.8,.2,1);
  background-image:repeating-linear-gradient(transparent 0 7.3cqw,rgba(138,47,61,.13) 7.3cqw 7.5cqw)}
.crt .folha.show{transform:none}
.crt .fecha{position:sticky;top:0;float:right;background:#8a2f3d;color:#fff;border:0;border-radius:50%;width:8cqw;height:8cqw;font:4cqw system-ui}

/* capa e contracapa */
.capa{background:#1f3d36;background-image:radial-gradient(circle at 30% 15%,rgba(255,255,255,.12),transparent 55%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 5px);color:var(--gold);cursor:pointer;
  text-align:center}
.capa .borda{position:absolute;inset:4.5cqw;border:.35cqw solid var(--gold);border-radius:1.5cqw;pointer-events:none;opacity:.9}
.capa .borda::after{content:"";position:absolute;inset:1.4cqw;border:.15cqw solid var(--gold);border-radius:1cqw;opacity:.6}
.capa .cena{background-size:100% 100%}
.capa .oval{position:absolute;left:50%;top:var(--oy,57cqw);width:var(--ow,35cqw);height:var(--oh,50cqw);transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;box-shadow:0 0 0 .5cqw var(--gold),inset 0 0 3cqw rgba(0,0,0,.5)}
.capa .txt{position:absolute;left:0;right:0;top:94cqw;text-shadow:0 .3cqw 1cqw rgba(0,0,0,.6)}
.capa .nomes{font-size:7.4cqw;font-style:italic;line-height:1}
.capa .nomes small{font-size:5cqw;opacity:.7;margin:0 1.5cqw}
.capa .sub{font-size:2.5cqw;letter-spacing:.35em;text-transform:uppercase}
.fim{background:#1f3d36;color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12cqw}
.fim .frase{font-style:italic;font-size:4.4cqw;color:#f1ead9;line-height:1.5}

/* ex-libris e sumário */
.exl{background:#1f3d36;color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10cqw}
.exl svg{width:44cqw;margin-bottom:5cqw}
.exl .faixa{font-size:2.4cqw;letter-spacing:.35em;text-transform:uppercase;border-top:1px solid;border-bottom:1px solid;padding:1.4cqw 4cqw;margin-bottom:3cqw}
.exl .nome{font-size:13cqw;font-style:italic;line-height:1}
.exl p{font-style:italic;font-size:3.4cqw;color:#f1ead9;opacity:.85;margin:3cqw 0 0;line-height:1.6}
.sum{background:#1f3d36}
.sum .folha{position:absolute;inset:8cqw 9cqw 9cqw;background:var(--cream);color:var(--ink);border-radius:1.5cqw;padding:8cqw 7cqw;
  box-shadow:inset 0 0 0 .3cqw #cdbb92,inset 0 0 0 1.2cqw var(--cream),inset 0 0 0 1.35cqw #cdbb92}
.sum h2{font-size:7cqw;font-style:italic;font-weight:400;text-align:center;margin:0 0 5cqw}
.sum ol{list-style:none;margin:0;padding:0}
.sum li button{display:flex;width:100%;align-items:baseline;gap:1.5cqw;background:none;border:0;padding:1.9cqw 0;font:3.6cqw var(--serif);color:var(--ink);text-align:left}
.sum li button:hover{color:#8a2f3d}
.sum li i{flex:1;border-bottom:.25cqw dotted #a8997a;transform:translateY(-.6cqw)}

/* baralho */
.bar{background:radial-gradient(circle at 50% 55%,#2c6b4c,#143826 75%)}
.bar .mesa{position:absolute;left:6cqw;right:6cqw;top:30cqw;bottom:22cqw}
.carta{position:absolute;width:25cqw;height:35cqw;background:#fff;border-radius:1.6cqw;padding:1.5cqw;transform:translate(-50%,-50%) rotate(var(--r));
  left:50%;top:50%;transition:left .7s cubic-bezier(.2,.8,.2,1),top .7s cubic-bezier(.2,.8,.2,1),transform .5s;box-shadow:0 1.2cqw 3cqw rgba(0,0,0,.45);cursor:pointer;border:0}
.carta .ft{border-radius:.8cqw}
.carta::before{content:"♥";position:absolute;inset:0;border-radius:1.6cqw;background:#8a2f3d;color:var(--gold);display:grid;place-items:center;font-size:9cqw;
  box-shadow:inset 0 0 0 1.2cqw #8a2f3d,inset 0 0 0 1.5cqw var(--gold);z-index:2;transition:opacity .5s .3s}
.bar.aberto .carta{left:var(--x);top:var(--y)}
.bar.aberto .carta::before{opacity:0;pointer-events:none}
.bar .carta.zoom{left:50%;top:50%;transform:translate(-50%,-50%) rotate(0) scale(1.9);z-index:9}
.bar .leg{position:absolute;left:7cqw;right:7cqw;bottom:6cqw;text-align:center;font-style:italic;font-size:3.5cqw;line-height:1.35;min-height:10cqw;z-index:10;text-shadow:0 .3cqw 1cqw #000}

/* cabine */
.cab{background:linear-gradient(#3a1422,#1e0a13)}
.cab .caixa{position:absolute;left:15cqw;right:15cqw;top:22cqw;bottom:13cqw;border-radius:3cqw 3cqw 1cqw 1cqw;padding:3cqw;
  background:linear-gradient(90deg,#5b3420,#7a4a2c 20%,#693d25 50%,#7a4a2c 80%,#5b3420);box-shadow:inset 0 0 0 .6cqw #3d2114,0 2cqw 5cqw rgba(0,0,0,.5)}
.cab .placa{background:#f3e3bd;color:#5b2a1c;text-align:center;border-radius:1.2cqw;padding:2.2cqw 1cqw 1.8cqw;font-size:3.6cqw;letter-spacing:.3em;text-transform:uppercase;
  box-shadow:0 0 0 .5cqw #c79a45,0 0 4cqw rgba(255,214,130,.6)}
.cab .placa small{display:block;font-size:2.2cqw;letter-spacing:.2em;font-style:italic;text-transform:none;margin-top:.6cqw}
.cab .luzes{display:flex;justify-content:space-around;margin:1.8cqw 2cqw}
.cab .luzes i{width:2cqw;height:2cqw;border-radius:50%;background:#ffe9a8;box-shadow:0 0 1.5cqw #ffd36b;animation:pisca 1.6s infinite alternate}
.cab .luzes i:nth-child(even){animation-delay:.8s}
@keyframes pisca{to{opacity:.35}}
.cab .janela{position:absolute;left:6cqw;right:6cqw;top:23cqw;bottom:5cqw;background:#150a0e;overflow:hidden;border-radius:.8cqw;box-shadow:inset 0 0 0 .6cqw #3d2114;cursor:pointer;
  display:flex;justify-content:center;gap:3cqw;padding:3cqw 2cqw}
.cab .tira{width:21cqw;background:#fff;padding:1.4cqw 1.4cqw 5cqw;display:flex;flex-direction:column;gap:1.2cqw;transform:translateY(-115%) rotate(var(--r));
  transition:transform 1.1s cubic-bezier(.2,.9,.3,1);box-shadow:0 1cqw 3cqw rgba(0,0,0,.6)}
.cab .tira .ft{flex:1}
.cab .cort{position:absolute;top:0;bottom:0;width:50.5%;background:repeating-linear-gradient(90deg,#7a1f33 0 2.2cqw,#a32c47 3.6cqw,#5e1727 5cqw);transition:transform 1s ease-in-out;z-index:3}
.cab .cort.e{left:0}.cab .cort.d{right:0}
.cab .flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:4;pointer-events:none}
.cab.on .cort.e{transform:translateX(-96%)}.cab.on .cort.d{transform:translateX(96%)}
.cab.on .tira{transform:translateY(0) rotate(var(--r))}
.cab.on .tira:nth-child(2){transition-delay:.5s}
.cab.on .flash{animation:flash .5s}
@keyframes flash{30%{opacity:.95}}
.cab .rodape{position:absolute;left:0;right:0;bottom:4.5cqw;text-align:center;font-style:italic;font-size:3.2cqw;opacity:.8}

/* céu e lua */
.noite{background:linear-gradient(#05060f,#0b1028 70%,#161a3a)}
.noite .st{position:absolute;inset:0}
.ceu canvas:not(.fx){z-index:7;position:absolute;left:11cqw;top:30cqw;width:78cqw;height:78cqw;border-radius:50%;cursor:pointer;box-shadow:0 0 0 .5cqw var(--gold),0 0 0 1.6cqw #0b1028,0 0 0 1.8cqw rgba(216,180,106,.6)}
.info{position:absolute;left:0;right:0;bottom:8cqw;text-align:center;font-size:2.5cqw;letter-spacing:.3em;text-transform:uppercase;line-height:2;opacity:.85}
.lua canvas:not(.fx){z-index:7;position:absolute;left:25cqw;top:32cqw;width:50cqw;height:50cqw;border-radius:50%;cursor:pointer;filter:drop-shadow(0 0 5cqw rgba(255,244,214,.45));transition:filter .6s}
.lua.rev canvas:not(.fx){filter:drop-shadow(0 0 9cqw rgba(255,214,150,.85)) sepia(.35)}
.lua .fase{position:absolute;left:0;right:0;top:90cqw;text-align:center}
.lua .fase b{display:block;font-size:6cqw;font-style:italic;font-weight:400}
.lua .pct{font-family:var(--hand);font-size:5.4cqw;margin-top:3cqw;opacity:0;transform:translateY(2cqw);transition:.7s}
.lua.rev .pct{opacity:1;transform:none}

/* jardim e buquê */
.jar{background:linear-gradient(#2a1c4f 0%,#6d3f7d 38%,#e19a86 62%,#f4cf9c 70%,#24331f 70.2%,#131d12 100%);cursor:pointer}
.jar .sol{position:absolute;left:50%;top:60cqw;width:30cqw;height:30cqw;margin-left:-15cqw;border-radius:50%;background:radial-gradient(circle,#ffe9b8,rgba(255,200,140,0) 70%)}
.flor{position:absolute;transform:translate(-50%,-50%) scale(var(--s,1)) rotate(var(--r,0deg));width:16cqw;height:16cqw;pointer-events:none}
.flor img{width:100%;height:100%;display:block;filter:drop-shadow(0 .8cqw 1.2cqw rgba(0,0,0,.45))}
.buq .papel{position:absolute;left:12cqw;top:48cqw;width:76cqw;z-index:3;pointer-events:none;filter:drop-shadow(0 1.5cqw 3cqw rgba(0,0,0,.5))}
.flor.nasce{animation:nasce .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes nasce{from{transform:translate(-50%,-50%) scale(0) rotate(-90deg)}}
.jar .frase{position:absolute;left:9cqw;right:9cqw;top:30cqw;text-align:center;font-style:italic;font-size:4cqw;line-height:1.5;opacity:0;transition:opacity 1.2s;z-index:6;text-shadow:0 .3cqw 1.5cqw #1a1030}
.jar.cheio .frase{opacity:1}
.buq{background:linear-gradient(#2a1c4f 0%,#6d3f7d 45%,#d98f86 68%,#24331f 68.2%,#131d12 100%)}
.buq .cone{position:absolute;left:30cqw;top:64cqw;width:40cqw;height:50cqw;background:linear-gradient(100deg,#f6ecd2,#d9c7a0 55%,#efe2c2);clip-path:polygon(0 0,100% 0,54% 100%,46% 100%);z-index:3;pointer-events:none}
