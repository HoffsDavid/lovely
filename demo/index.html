<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presente Especial — David & Lohanny</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              400: '#E04A78', 500: '#C42B5E', 600: '#A5193F',
              700: '#8A1133', 800: '#6E0D29', 900: '#51081D',
            },
            cream: { 100: '#FEF5F7' },
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            sans:    ['"DM Sans"', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; background: #1C0E26; }

    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeUp  { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulseSoft { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes blink   { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes heartFall {
      0%   { transform: translateY(-40px) rotate(-8deg); opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { transform: translateY(110vh) rotate(8deg); opacity: 0; }
    }

    .anim-fade-in   { animation: fadeIn 0.6s ease-out both; }
    .anim-fade-up   { animation: fadeUp 0.7s ease-out both; }
    .anim-pulse     { animation: pulseSoft 3s ease-in-out infinite; }
    .anim-float     { animation: float 5s ease-in-out infinite; }

    .typing-cursor      { font-style: normal; animation: blink 0.85s step-end infinite; }
    .typing-cursor-done { opacity: 0; animation: none; }

    .heart-fall {
      position: fixed; pointer-events: none; user-select: none; z-index: 0;
      animation: heartFall linear infinite;
      color: #E04A78;
    }

    /* Swiper cards layout */
    .gift-cards-wrapper { display: flex; justify-content: center; padding: 0 2rem; }
    .gift-cards-swiper  { width: 220px !important; height: 340px !important; overflow: visible !important; }
    .gift-cards-swiper .swiper-slide {
      border-radius: 0 !important;
      background: #fff;
      padding: 10px 10px 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .gift-cards-swiper .swiper-slide img {
      width: 100%; height: calc(100% - 38px); object-fit: cover; display: block;
    }
  </style>
</head>
<body>
  <div id="root" style="display:none"></div>
  <div id="loading" style="min-height:100vh;background:linear-gradient(135deg,#1C0E26,#2A1235,#1C0E26);display:flex;align-items:center;justify-content:center;">
    <span style="color:rgba(255,255,255,0.3);font-family:DM Sans,sans-serif;font-size:14px;">Carregando...</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    /* ── Static card data ── */
    const CARD = {
      nameA: 'David',
      nameB: 'Lohanny',
      startDate: '2025-04-12',
      message: `Bons sonhos pra você, e durma sabendo que você é muito importante pra mim e que vou estar contigo pra sempre\n\nMeu principal objetivo de vida atualmente é ter você dormindo cmg todo dia. Então se prepare, mudanças vão acontecer`,
      quotes: ['Voce eh tudo pra mim', 'Voce eh minha vida', 'Voce me completa'],
      photos: [
        'src/WhatsApp Image 2026-05-04 at 22.35.23.jpeg',
        'src/WhatsApp Image 2026-05-04 at 22.35.23 (1).jpeg',
        'src/WhatsApp Image 2026-05-04 at 22.35.24.jpeg',
        'src/WhatsApp Image 2026-05-04 at 22.35.24 (1).jpeg',
        'src/WhatsApp Image 2026-05-04 at 22.35.24 (2).jpeg',
      ],
      music: {
        title: 'Entregador de Flor (Ao Vivo em Brasília)',
        artist: '',
        cover: null,
        preview: null,
      },
    };

    /* ── Duration counter ── */
    function useDuration(startDate) {
      const calc = useCallback(() => {
        if (!startDate) return '';
        const diff = Date.now() - new Date(startDate).getTime();
        if (diff < 0) return '';
        const s      = Math.floor(diff / 1000);
        const years  = Math.floor(s / (365.25 * 86400));
        const months = Math.floor((s % (365.25 * 86400)) / (30.44 * 86400));
        const days   = Math.floor((s % (30.44 * 86400)) / 86400);
        const parts  = [];
        if (years  > 0) parts.push(`${years} ano${years > 1 ? 's' : ''}`);
        if (months > 0) parts.push(`${months} ${months > 1 ? 'meses' : 'mês'}`);
        parts.push(`${days} dia${days !== 1 ? 's' : ''}`);
        return parts.join(', ');
      }, [startDate]);

      const [text, setText] = useState(() => calc());
      useEffect(() => {
        const id = setInterval(() => setText(calc()), 60000);
        return () => clearInterval(id);
      }, [calc]);
      return text;
    }

    /* ── Heart rain ── */
    function HeartRain() {
      const hearts = useMemo(() =>
        Array.from({ length: 40 }, (_, i) => ({
          id:       i,
          left:     `${Math.random() * 96}%`,
          delay:    `${(Math.random() * 12).toFixed(2)}s`,
          duration: `${(8 + Math.random() * 10).toFixed(2)}s`,
          size:     `${10 + Math.random() * 14}px`,
          opacity:  0.10 + Math.random() * 0.20,
        })), []);

      return (
        <>
          {hearts.map(h => (
            <span
              key={h.id}
              className="heart-fall"
              style={{
                left: h.left, top: '-40px',
                fontSize: h.size, opacity: h.opacity,
                animationDelay: h.delay, animationDuration: h.duration,
              }}
            >❤</span>
          ))}
        </>
      );
    }

    /* ── Music player ── */
    function MusicPlayer({ music }) {
      const audioRef  = useRef(null);
      const [playing, setPlaying]   = useState(false);
      const [progress, setProgress] = useState(0);

      useEffect(() => {
        if (!music?.preview) return;
        const a = new Audio(music.preview);
        audioRef.current = a;
        a.ontimeupdate = () => setProgress((a.currentTime / a.duration) * 100 || 0);
        a.onended = () => setPlaying(false);
        return () => { a.pause(); audioRef.current = null; };
      }, [music?.preview]);

      const toggle = () => {
        if (!audioRef.current) return;
        if (playing) { audioRef.current.pause(); setPlaying(false); }
        else         { audioRef.current.play();  setPlaying(true); }
      };

      return (
        <div style={{ display:'flex', alignItems:'center', gap:16, background:'rgba(255,255,255,0.08)', backdropFilter:'blur(12px)', borderRadius:16, padding:16, border:'1px solid rgba(255,255,255,0.1)' }}>
          <div style={{ width:48, height:48, borderRadius:12, background:'rgba(138,17,51,0.6)', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', fontSize:22 }}>
            🎵
          </div>
          <div style={{ flex:1, minWidth:0 }}>
            <p style={{ color:'#FEF5F7', fontWeight:500, fontSize:14, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', margin:'0 0 2px' }}>
              {music.title}
            </p>
            {music.artist && (
              <p style={{ color:'rgba(255,255,255,0.5)', fontSize:12, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', margin:0 }}>
                {music.artist}
              </p>
            )}
            <div style={{ marginTop:8, height:2, background:'rgba(255,255,255,0.15)', borderRadius:999, overflow:'hidden' }}>
              <div style={{ height:'100%', width:`${progress}%`, background:'#E04A78', borderRadius:999, transition:'width 0.3s' }} />
            </div>
          </div>
          <button
            onClick={toggle}
            disabled={!music.preview}
            style={{ width:40, height:40, background:'rgba(255,255,255,0.9)', borderRadius:'50%', border:'none', cursor: music.preview ? 'pointer' : 'not-allowed', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', fontSize:15, color:'#A5193F', opacity: music.preview ? 1 : 0.4, boxShadow:'0 4px 12px rgba(0,0,0,0.3)' }}
            aria-label={playing ? 'Pausar' : 'Tocar'}
          >
            {playing ? '⏸' : '▶'}
          </button>
        </div>
      );
    }

    /* ── Typing text ── */
    function TypingText({ quotes, startDelay = 800 }) {
      const active = useMemo(() => (quotes || []).filter(q => q?.trim()), [quotes]);
      const [displayed, setDisplayed] = useState('');
      const [typing, setTyping]       = useState(true);

      useEffect(() => {
        if (!active.length) return;
        let t, iv, cancelled = false, idx = 0;

        const typeIn = () => {
          const text = active[idx]; let i = 0;
          setDisplayed(''); setTyping(true);
          iv = setInterval(() => {
            if (cancelled) return clearInterval(iv);
            setDisplayed(text.slice(0, ++i));
            if (i >= text.length) { clearInterval(iv); t = setTimeout(typeOut, 5000); }
          }, 120);
        };

        const typeOut = () => {
          const text = active[idx]; let i = text.length;
          setTyping(false);
          iv = setInterval(() => {
            if (cancelled) return clearInterval(iv);
            setDisplayed(text.slice(0, --i));
            if (i <= 0) { clearInterval(iv); idx = (idx + 1) % active.length; t = setTimeout(typeIn, 600); }
          }, 80);
        };

        t = setTimeout(typeIn, startDelay);
        return () => { cancelled = true; clearTimeout(t); clearInterval(iv); };
      }, [active, startDelay]);

      if (!active.length) return null;

      return (
        <div style={{ textAlign:'center', padding:'0 8px' }}>
          <p style={{ fontFamily:'"Playfair Display",Georgia,serif', color:'rgba(255,255,255,0.55)', fontSize:18, fontStyle:'italic', lineHeight:1.6, margin:0 }}>
            &ldquo;{displayed}<span className={typing ? 'typing-cursor' : 'typing-cursor-done'}>|</span>&rdquo;
          </p>
        </div>
      );
    }

    /* ── Photo carousel (Swiper cards) ── */
    function PhotoCarousel({ photos }) {
      const wrapperRef = useRef(null);

      useEffect(() => {
        if (!photos?.length || !wrapperRef.current) return;
        const swiper = new Swiper(wrapperRef.current, {
          effect: 'cards',
          grabCursor: true,
          cardsEffect: { perSlideOffset: 8, perSlideRotate: 3, rotate: true, slideShadows: true },
        });
        return () => swiper.destroy?.();
      }, []);

      if (!photos?.length) return null;

      return (
        <div className="gift-cards-wrapper">
          <div ref={wrapperRef} className="swiper gift-cards-swiper">
            <div className="swiper-wrapper">
              {photos.map((src, i) => (
                <div key={i} className="swiper-slide">
                  <img src={src} alt={`Foto ${i + 1}`} />
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    /* ── Floating hearts on entrance screen ── */
    const FLOATERS = [
      { top:'8%',  left:'6%',   size:16, delay:0,   dur:4.0 },
      { top:'15%', right:'9%',  size:11, delay:0.6, dur:4.6 },
      { top:'38%', left:'3%',   size:10, delay:1.1, dur:5.0 },
      { top:'60%', left:'8%',   size:14, delay:0.3, dur:4.3 },
      { top:'78%', left:'14%',  size:9,  delay:1.4, dur:5.4 },
      { top:'88%', left:'45%',  size:11, delay:0.9, dur:4.9 },
      { top:'72%', right:'7%',  size:15, delay:0.2, dur:4.2 },
      { top:'45%', right:'4%',  size:10, delay:1.6, dur:5.6 },
      { top:'22%', right:'20%', size:7,  delay:0.7, dur:4.7 },
      { top:'92%', right:'25%', size:9,  delay:1.3, dur:5.3 },
    ];

    /* ── Entrance screen ── */
    function EntranceScreen({ nameA, onOpen, closing }) {
      return (
        <div
          onClick={onOpen}
          style={{
            position:'fixed', inset:0, zIndex:50, cursor:'pointer',
            background:'linear-gradient(135deg,#1C0E26 0%,#2A1235 50%,#1C0E26 100%)',
            display:'flex', alignItems:'center', justifyContent:'center', padding:'0 24px',
            opacity: closing ? 0 : 1,
            transform: closing ? 'scale(1.06)' : 'scale(1)',
            transition:'opacity 0.7s ease-in-out, transform 0.7s ease-in-out',
          }}
        >
          {/* Decorative floating hearts */}
          {FLOATERS.map((f, i) => (
            <span
              key={i}
              style={{
                position:'absolute', top:f.top, left:f.left, right:f.right,
                fontSize:f.size, color:'#E04A78', opacity:0.75, pointerEvents:'none',
                animation:`float ${f.dur}s ${f.delay}s ease-in-out infinite`,
              }}
            >❤</span>
          ))}

          {/* Content */}
          <div className="anim-fade-up" style={{ textAlign:'center', maxWidth:320, position:'relative', zIndex:1 }}>

            {/* Gift box */}
            <div style={{ position:'relative', display:'inline-flex', marginBottom:40 }}>
              <div style={{ position:'absolute', width:160, height:160, borderRadius:'50%', background:'rgba(165,25,63,0.18)', filter:'blur(40px)', top:'50%', left:'50%', transform:'translate(-50%,-50%)', animation:'pulseSoft 3s ease-in-out infinite' }} />
              <div style={{ display:'flex', flexDirection:'column', alignItems:'center', position:'relative' }}>
                {/* Bow */}
                <div style={{ display:'flex', alignItems:'flex-end', marginBottom:-2, zIndex:2 }}>
                  <div style={{ width:32, height:24, borderRadius:'12px 0 0 12px', border:'3px solid rgba(224,74,120,0.7)', borderRight:'none', transform:'rotate(-12deg) translateX(4px)' }} />
                  <div style={{ width:12, height:12, borderRadius:'50%', background:'rgba(224,74,120,0.8)', zIndex:3 }} />
                  <div style={{ width:32, height:24, borderRadius:'0 12px 12px 0', border:'3px solid rgba(224,74,120,0.7)', borderLeft:'none', transform:'rotate(12deg) translateX(-4px)' }} />
                </div>
                {/* Lid */}
                <div style={{ width:112, height:32, background:'linear-gradient(135deg,rgba(196,43,94,0.8),rgba(138,17,51,0.8))', borderRadius:'12px 12px 0 0', position:'relative', overflow:'hidden', boxShadow:'0 4px 8px rgba(0,0,0,0.3)' }}>
                  <div style={{ position:'absolute', inset:0, width:16, background:'rgba(224,74,120,0.3)', margin:'0 auto' }} />
                </div>
                {/* Body */}
                <div style={{ width:128, height:80, background:'linear-gradient(135deg,rgba(165,25,63,0.6),rgba(26,8,35,0.8))', borderRadius:'0 0 16px 16px', position:'relative', overflow:'hidden', boxShadow:'0 12px 30px rgba(0,0,0,0.6)', border:'1px solid rgba(224,74,120,0.2)', display:'flex', alignItems:'center', justifyContent:'center' }}>
                  <div style={{ position:'absolute', inset:0, width:16, background:'rgba(224,74,120,0.25)', margin:'0 auto' }} />
                  <span style={{ fontSize:28, color:'rgba(224,74,120,0.3)', position:'relative' }}>❤</span>
                </div>
              </div>
            </div>

            <p style={{ color:'rgba(255,255,255,0.4)', fontSize:12, textTransform:'uppercase', letterSpacing:'0.2em', margin:'0 0 12px' }}>
              você recebeu
            </p>
            <h1 style={{ fontFamily:'"Playfair Display",Georgia,serif', fontSize:30, color:'#FEF5F7', lineHeight:1.3, margin:'0 0 12px' }}>
              um presente<br /><em>especial</em>
            </h1>
            <p style={{ color:'rgba(255,255,255,0.35)', fontSize:14, margin:0 }}>
              de {nameA}
            </p>

            <div style={{ marginTop:40, display:'flex', flexDirection:'column', alignItems:'center', gap:12 }}>
              <div style={{ display:'inline-flex', alignItems:'center', gap:8, background:'rgba(165,25,63,0.8)', color:'#FEF5F7', fontWeight:500, padding:'14px 28px', borderRadius:9999, fontSize:14, letterSpacing:'0.05em', boxShadow:'0 8px 20px rgba(80,8,29,0.4)' }}>
                🎁 Abrir presente
              </div>
              <p className="anim-pulse" style={{ color:'rgba(255,255,255,0.2)', fontSize:12, margin:0 }}>
                toque em qualquer lugar
              </p>
            </div>
          </div>
        </div>
      );
    }

    /* ── App root ── */
    function App() {
      const [opened,  setOpened]  = useState(false);
      const [closing, setClosing] = useState(false);
      const duration = useDuration(CARD.startDate);

      const handleOpen = () => {
        setClosing(true);
        setTimeout(() => setOpened(true), 650);
      };

      const BG = { background:'linear-gradient(135deg,#1C0E26 0%,#2A1235 50%,#1C0E26 100%)', minHeight:'100vh' };

      return (
        <>
          {!opened && <EntranceScreen nameA={CARD.nameA} onOpen={handleOpen} closing={closing} />}

          <div style={{ ...BG, padding:'3rem 1rem', opacity: opened ? 1 : 0, transition:'opacity 0.7s', position:'relative' }}>
            {opened && <HeartRain />}

            <div
              className="anim-fade-in"
              style={{ maxWidth:512, margin:'0 auto', position:'relative', zIndex:10, display:'flex', flexDirection:'column', gap:24 }}
            >
              <MusicPlayer music={CARD.music} />

              <PhotoCarousel photos={CARD.photos} />

              <div style={{ textAlign:'center' }}>
                <h1 style={{ fontFamily:'"Playfair Display",Georgia,serif', fontSize:36, fontWeight:700, color:'#FEF5F7', margin:0 }}>
                  {CARD.nameA} &amp; {CARD.nameB}
                </h1>
                {duration && (
                  <p style={{ color:'rgba(255,255,255,0.5)', fontSize:14, margin:'8px 0 0', display:'flex', alignItems:'center', justifyContent:'center', gap:6 }}>
                    <span>⏱</span> {duration}
                  </p>
                )}
              </div>

              <div style={{ background:'rgba(255,255,255,0.08)', backdropFilter:'blur(12px)', borderRadius:24, padding:28, border:'1px solid rgba(255,255,255,0.1)' }}>
                <p style={{ fontFamily:'"Playfair Display",Georgia,serif', color:'rgba(255,255,255,0.9)', fontSize:16, lineHeight:1.8, fontStyle:'italic', textAlign:'center', whiteSpace:'pre-line', margin:0 }}>
                  &ldquo;{CARD.message}&rdquo;
                </p>
              </div>

              <div style={{ display:'flex', justifyContent:'center' }}>
                <span className="anim-pulse" style={{ fontSize:32, color:'#E04A78' }}>❤</span>
              </div>

              <TypingText quotes={CARD.quotes} startDelay={800} />

              <div style={{ paddingBottom:16 }} />
            </div>
          </div>
        </>
      );
    }

    /* ── Mount ── */
    document.getElementById('loading').style.display = 'none';
    document.getElementById('root').style.display    = 'block';
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
